name: Reels samples (render only, never posts)

# Manual only: no schedule, no push/PR triggers. Renders sample Reels through the automatic path and uploads them as an
# artifact. It gets NO Meta / LinkedIn / Buffer / Telegram secrets and read-only repo access, so it cannot post or commit.
on:
  workflow_dispatch:
    inputs:
      slugs:
        description: 'Comma-separated post slugs (empty = 4 most recent)'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: reels-samples
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: automation/actions/package-lock.json
      - name: Install render deps
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          python3 -m pip install --quiet --break-system-packages pillow numpy || python3 -m pip install --quiet pillow numpy
      - name: Cache Piper voice (Reels voiceover)
        uses: actions/cache@v4
        with:
          path: ~/.cache/aifeed-piper
          key: piper-voice-en_US-ryan-high-v1
      - name: Install Reels voiceover (Piper TTS, free and offline)
        # Free neural TTS that runs on the runner CPU: no API, no key. The voice (~115 MB) is downloaded once from the
        # rhasspy/piper-voices Hugging Face repo and cached above. If any of this fails the Reel renders music-only.
        continue-on-error: true
        run: |
          python3 -m pip install --quiet --break-system-packages "piper-tts[alignment]==1.8.0" || python3 -m pip install --quiet "piper-tts[alignment]==1.8.0"
          python3 -c "import sys; sys.path.insert(0, 'automation/reels'); import voice; p = voice.voice_path(); print('piper voice:', p or 'MISSING'); sys.exit(0 if p else 1)"
      - name: Install pipeline libs
        working-directory: automation/actions
        run: npm ci
      - name: Render samples
        env:
          # no Cloudflare secrets: samples must never spend the free Workers AI quota the live autopilot relies on
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SAMPLE_SLUGS: ${{ inputs.slugs }}
          SAMPLES_OUT: ${{ runner.temp }}/reel-samples
        run: node automation/reels/render_samples.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reel-samples
          path: ${{ runner.temp }}/reel-samples
          retention-days: 7
