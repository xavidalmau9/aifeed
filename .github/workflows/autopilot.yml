name: AIFeed autopilot

# GitHub cron is UTC. America/New_York is UTC-4 during EDT and UTC-5 during EST.
# Both offsets are scheduled; the job exits immediately unless the local ET hour is 8-9 (slot 1) or 17-18 (slot 2).
# Hour 9 / 18 is a grace window for GitHub cron delays; the slot claim + history keep it to one post per slot.
on:
  schedule:
    - cron: '0 12 * * *' # 08:00 EDT
    - cron: '0 13 * * *' # 08:00 EST
    - cron: '0 21 * * *' # 17:00 EDT
    - cron: '0 22 * * *' # 17:00 EST
  workflow_dispatch:
    inputs:
      slot:
        description: 'auto uses 8:00 ET as slot 1 and 17:00 ET as slot 2'
        type: choice
        options:
          - auto
          - '1'
          - '2'
        default: auto
      dry_run:
        description: 'Render PNGs and captions as artifacts. Do not post or commit.'
        type: boolean
        default: false
      take_over:
        description: 'Reclaim a slot stuck in status claimed. Posted slots and history entries are still skipped.'
        type: boolean
        default: false
  pull_request:
    paths:
      - 'automation/actions/**'
      - '.github/workflows/autopilot.yml'
      - 'automation/n8n/**'

# Scheduled and manual runs share one group so two posts never overlap.
# Pull-request test runs use their own group and do not block a post.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('aifeed-autopilot-{0}', github.ref) || 'aifeed-autopilot' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: automation/actions/package-lock.json
      - name: Install Chrome
        run: |
          if ! command -v google-chrome >/dev/null 2>&1; then
            wget -q -O /tmp/chrome.deb https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
            sudo apt-get update
            sudo apt-get install -y /tmp/chrome.deb
          fi
      - name: Test pipeline
        working-directory: automation/actions
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: |
          npm ci
          npm test
      - name: Telegram alert when a scheduled run fails its tests
        if: failure() && github.event_name != 'pull_request'
        working-directory: automation/actions
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ALERT_TEXT: |
            AIFeed Autopilot tests failed, so nothing was posted
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node alert.js

  post:
    needs: test
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          token: ${{ secrets.AIFEED_GH_TOKEN || github.token }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: automation/actions/package-lock.json
      - name: Install Chrome
        run: |
          if ! command -v google-chrome >/dev/null 2>&1; then
            wget -q -O /tmp/chrome.deb https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
            sudo apt-get update
            sudo apt-get install -y /tmp/chrome.deb
          fi
      - name: Install pipeline
        working-directory: automation/actions
        run: npm ci
      - name: Run autopilot
        working-directory: automation/actions
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          META_PAGE_TOKEN: ${{ secrets.META_PAGE_TOKEN }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          AIFEED_AUTOPILOT_COMMIT: ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && '0' || '1' }}
          DRY_RUN: ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && '1' || '0' }}
          SLOT: ${{ (github.event_name == 'workflow_dispatch' && inputs.slot) || 'auto' }}
          EVENT_NAME: ${{ github.event_name }}
          TAKE_OVER: ${{ (github.event_name == 'workflow_dispatch' && inputs.take_over) && '1' || '0' }}
          REPO_ROOT: ${{ github.workspace }}
          CHROME_PATH: /usr/bin/google-chrome
        run: node pipeline.js
      - name: Upload dry-run artifacts
        if: success() && github.event_name == 'workflow_dispatch' && inputs.dry_run
        uses: actions/upload-artifact@v4
        with:
          name: aifeed-dry-run
          path: automation/actions/out/
          if-no-files-found: error
      - name: Telegram failure alert
        if: failure()
        working-directory: automation/actions
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ALERT_TEXT: |
            AIFeed Autopilot failed
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node alert.js
