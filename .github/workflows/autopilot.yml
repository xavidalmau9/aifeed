name: AIFeed autopilot

# GitHub cron is UTC. America/New_York is UTC-4 during EDT and UTC-5 during EST.
# Both offsets are scheduled; the job exits immediately unless the local ET hour is 8-9 (slot 1) or 17-18 (slot 2).
# Minute :03, not :00: GitHub drops/delays many top-of-the-hour schedules. Gate windows are unchanged.
# Hour 9 / 18 is a grace window for GitHub cron delays; the slot claim + history keep it to one post per slot.
on:
  schedule:
    - cron: '3 12 * * *' # 08:03 EDT
    - cron: '3 13 * * *' # 08:03 EST
    - cron: '3 21 * * *' # 17:03 EDT
    - cron: '3 22 * * *' # 17:03 EST
  workflow_dispatch:
    inputs:
      slot:
        description: 'auto uses 8:00 ET as slot 1 and 17:00 ET as slot 2'
        type: choice
        options:
          - auto
          - '1'
          - '2'
        default: auto
      dry_run:
        description: 'Render PNGs and captions as artifacts. Do not post or commit.'
        type: boolean
        default: false
      take_over:
        description: 'Reclaim a slot stuck in status claimed. Posted slots and history entries are still skipped.'
        type: boolean
        default: false
      finish_slug:
        description: 'Story slug already on the site with no Instagram post. Posts the Reel (Reels tab only, real photo cover), Story and Facebook, then marks that slot posted. Empty runs the normal autopilot.'
        type: string
        required: false
        default: ''
  pull_request:
    paths:
      - 'automation/actions/**'
      - '.github/workflows/autopilot.yml'
      - 'automation/n8n/**'
      - 'automation/reels/**'

# Scheduled and manual runs share one group so two posts never overlap.
# Pull-request test runs use their own group and do not block a post.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('aifeed-autopilot-{0}', github.ref) || 'aifeed-autopilot' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: automation/actions/package-lock.json
      - name: Install Chrome
        run: |
          if ! command -v google-chrome >/dev/null 2>&1; then
            wget -q -O /tmp/chrome.deb https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
            sudo apt-get update
            sudo apt-get install -y /tmp/chrome.deb
          fi
      - name: Test pipeline
        working-directory: automation/actions
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: |
          npm ci
          npm test
      - name: Telegram alert when a scheduled run fails its tests
        if: failure() && github.event_name != 'pull_request'
        working-directory: automation/actions
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ALERT_TEXT: |
            AIFeed Autopilot tests failed, so nothing was posted
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node alert.js

  post:
    needs: test
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # 75 covers Reel render, public-URL waits and the end-of-run Story retry. Installs no longer
    # share that budget with apt: ffmpeg is a cached static build, and it finishes before the
    # pipeline is allowed to claim a slot.
    timeout-minutes: 75
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          token: ${{ secrets.AIFEED_GH_TOKEN || github.token }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: automation/actions/package-lock.json
      - name: Cache Kokoro TTS model (Reels voiceover)
        uses: actions/cache@v4
        with:
          path: ~/.cache/aifeed-kokoro
          key: kokoro-82m-v1.0-timestamped-fp32-am_michael-v1
      - name: Cache static ffmpeg
        uses: actions/cache@v4
        with:
          path: ~/.cache/aifeed-ffmpeg
          key: ffmpeg-johnvansickle-7.0.2-amd64-abda8d77
      - name: Install static ffmpeg
        run: bash automation/actions/install-ffmpeg.sh
      - name: Install Pillow and numpy
        run: python3 -m pip install --quiet --break-system-packages pillow numpy || python3 -m pip install --quiet pillow numpy
      - name: Install Reels voiceover (Kokoro-82M TTS, free and offline)
        # Kokoro-82M (Apache-2.0) on the runner CPU via ONNX Runtime: no API, no key. The timestamped ONNX export (~325 MB)
        # and the voice are downloaded once from Hugging Face and cached above. misaki = Kokoro's own G2P (Apache-2.0).
        # If any of this fails the Reel renders music-only.
        continue-on-error: true
        run: |
          PKGS='kokoro-onnx==0.6.1 misaki==0.7.4 num2words spacy en_core_web_sm@https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl'
          python3 -m pip install --quiet --break-system-packages $PKGS || python3 -m pip install --quiet $PKGS
          python3 -c "import sys; sys.path.insert(0, 'automation/reels'); import voice; p = voice.voice_path(); print('kokoro model:', p or 'MISSING'); sys.exit(0 if p else 1)"
      - name: Install Chrome
        run: |
          if ! command -v google-chrome >/dev/null 2>&1; then
            wget -q -O /tmp/chrome.deb https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
            sudo apt-get update
            sudo apt-get install -y /tmp/chrome.deb
          fi
      - name: Install pipeline
        working-directory: automation/actions
        run: npm ci
      - name: Verify Reels tools before a slot can be claimed
        run: |
          line="$(ffmpeg -version | head -n 1)"
          echo "$line"
          case "$line" in
            *7.0.2-static*) ;;
            *) echo "pinned static ffmpeg is not first on PATH" >&2; exit 1 ;;
          esac
          python3 -c "import PIL, numpy; print('pillow numpy ok')"
      - name: Run autopilot
        working-directory: automation/actions
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          META_PAGE_TOKEN: ${{ secrets.META_PAGE_TOKEN }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          AIFEED_AUTOPILOT_COMMIT: ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && '0' || '1' }}
          DRY_RUN: ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && '1' || '0' }}
          SLOT: ${{ (github.event_name == 'workflow_dispatch' && inputs.slot) || 'auto' }}
          EVENT_NAME: ${{ github.event_name }}
          TAKE_OVER: ${{ (github.event_name == 'workflow_dispatch' && inputs.take_over) && '1' || '0' }}
          FINISH_SLUG: ${{ github.event_name == 'workflow_dispatch' && inputs.finish_slug || '' }}
          REPO_ROOT: ${{ github.workspace }}
          CHROME_PATH: /usr/bin/google-chrome
        run: node pipeline.js
      - name: Upload dry-run artifacts
        if: success() && github.event_name == 'workflow_dispatch' && inputs.dry_run
        uses: actions/upload-artifact@v4
        with:
          name: aifeed-dry-run
          path: automation/actions/out/
          if-no-files-found: error
      - name: Telegram failure alert
        if: failure()
        working-directory: automation/actions
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ALERT_TEXT: |
            AIFeed Autopilot failed
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node alert.js
