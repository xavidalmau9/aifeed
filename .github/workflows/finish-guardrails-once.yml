name: AIFeed finish stranded social

# One-shot runner for the Oct 22 slot that published to the site and then timed out.
# workflow_dispatch is blocked for the Cursor GitHub App, so this file's push starts the
# same finish path autopilot.yml exposes as finish_slug. It checks out main (the merged code).
on:
  push:
    branches:
      - cursor/autopilot-finish-ffmpeg-bdfe
    paths:
      - .github/workflows/finish-guardrails-once.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aifeed-autopilot
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          token: ${{ secrets.AIFEED_GH_TOKEN || github.token }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: automation/actions/package-lock.json
      - name: Cache Kokoro TTS model (Reels voiceover)
        uses: actions/cache@v4
        with:
          path: ~/.cache/aifeed-kokoro
          key: kokoro-82m-v1.0-timestamped-fp32-am_michael-v1
      - name: Cache static ffmpeg
        uses: actions/cache@v4
        with:
          path: ~/.cache/aifeed-ffmpeg
          key: ffmpeg-johnvansickle-7.0.2-amd64-abda8d77
      - name: Install static ffmpeg
        run: bash automation/actions/install-ffmpeg.sh
      - name: Install Pillow and numpy
        run: python3 -m pip install --quiet --break-system-packages pillow numpy || python3 -m pip install --quiet pillow numpy
      - name: Install Reels voiceover (Kokoro-82M TTS, free and offline)
        continue-on-error: true
        run: |
          PKGS='kokoro-onnx==0.6.1 misaki==0.7.4 num2words spacy en_core_web_sm@https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl'
          python3 -m pip install --quiet --break-system-packages $PKGS || python3 -m pip install --quiet $PKGS
          python3 -c "import sys; sys.path.insert(0, 'automation/reels'); import voice; p = voice.voice_path(); print('kokoro model:', p or 'MISSING'); sys.exit(0 if p else 1)"
      - name: Install Chrome
        run: |
          if ! command -v google-chrome >/dev/null 2>&1; then
            wget -q -O /tmp/chrome.deb https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
            sudo apt-get update
            sudo apt-get install -y /tmp/chrome.deb
          fi
      - name: Install pipeline
        working-directory: automation/actions
        run: npm ci
      - name: Verify Reels tools before a slot can be claimed
        run: |
          line="$(ffmpeg -version | head -n 1)"
          echo "$line"
          case "$line" in
            *7.0.2-static*) ;;
            *) echo "pinned static ffmpeg is not first on PATH" >&2; exit 1 ;;
          esac
          python3 -c "import PIL, numpy; print('pillow numpy ok')"
      - name: Finish social for the stranded story
        working-directory: automation/actions
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          META_PAGE_TOKEN: ${{ secrets.META_PAGE_TOKEN }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          AIFEED_AUTOPILOT_COMMIT: '1'
          DRY_RUN: '0'
          SLOT: auto
          EVENT_NAME: workflow_dispatch
          TAKE_OVER: '0'
          FINISH_SLUG: ai-guardrails-arent-stopping-criminal-hackers
          REPO_ROOT: ${{ github.workspace }}
          CHROME_PATH: /usr/bin/google-chrome
        run: node pipeline.js
      - name: Telegram failure alert
        if: failure()
        working-directory: automation/actions
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ALERT_TEXT: |
            AIFeed finish path failed
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node alert.js
