name: Render HTML Graphics to PNG

on:
  push:
    paths:
      - 'graphics/*.html'

jobs:
  render:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache Puppeteer
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            ~/.cache/puppeteer
          key: ${{ runner.os }}-puppeteer-v3

      - name: Install Puppeteer
        run: npm install puppeteer

      - name: Render PNGs + Send to Telegram for Approval
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          node << 'JSEOF'
          const puppeteer = require('puppeteer');
          const fs   = require('fs');
          const path = require('path');
          const { execSync } = require('child_process');

          const BOT_TOKEN = process.env.TELEGRAM_BOT_TOKEN;
          const CHAT_ID   = process.env.TELEGRAM_CHAT_ID;

          // ── main ─────────────────────────────────────────────────────────────

          (async () => {
            const browser = await puppeteer.launch({
              args: ['--no-sandbox', '--disable-setuid-sandbox', '--disable-dev-shm-usage']
            });

            const graphicsDir = './graphics';
            const imagesDir   = './images';

            const files = fs.readdirSync(graphicsDir).filter(f => f.endsWith('.html'));

            for (const file of files) {
              const pngName = file.replace('.html', '.png');
              const pngPath = path.join(imagesDir, pngName);
              if (fs.existsSync(pngPath)) {
                console.log('Already exists:', pngName);
                continue;
              }

              console.log('Processing:', file);
              let html = fs.readFileSync(path.join(graphicsDir, file), 'utf8');

              // Embed background photo as base64 — Puppeteer cannot reach external URLs
              const alreadyEmbedded = html.includes('data:image/jpeg;base64,') || html.includes('data:image/png;base64,');
              if (alreadyEmbedded) {
                console.log('Photo already embedded as base64');
              } else {
                // FALLBACK: if no img.bg tag at all, inject a generic tech photo
                if (!html.includes('class="bg"')) {
                  const fallbackUrl = 'https://images.unsplash.com/photo-1518186285589-2f7649de83e0?w=1080&h=1350&fit=crop&q=85&fm=jpg';
                  html = html.replace('<div class="c"><div class="ov">', '<div class="c"><img class="bg" src="' + fallbackUrl + '" alt=""><div class="ov">');
                  console.log('No img.bg found — injected fallback photo URL');
                }
                const urlMatch = html.match(/class="bg"[^>]*src="(https?:\/\/[^"]+)"/);
                if (!urlMatch) {
                  console.log('No external photo URL found in HTML — graphic will have no background');
                } else {
                  let photoUrl = urlMatch[1];
                  const unsplashId = photoUrl.match(/images\.unsplash\.com\/photo-([a-zA-Z0-9_-]+)/);
                  if (unsplashId) {
                    photoUrl = 'https://unsplash.com/photos/' + unsplashId[1] + '/download?force=true';
                  }
                  console.log('Downloading photo:', photoUrl.substring(0, 80));
                  try {
                    execSync('curl -sL --user-agent "Mozilla/5.0 (compatible; AIFeed/1.0; +https://aifeed.run)" "' + photoUrl + '" -o /tmp/photo_embed.jpg', { timeout: 30000 });
                    const stat = fs.statSync('/tmp/photo_embed.jpg');
                    if (stat.size > 10000) {
                      const b64 = fs.readFileSync('/tmp/photo_embed.jpg').toString('base64');
                      html = html.replace(urlMatch[0], urlMatch[0].replace(urlMatch[1], 'data:image/jpeg;base64,' + b64));
                      console.log('Photo embedded (' + Math.round(stat.size/1024) + 'KB)');
                    } else {
                      console.log('Photo download too small (' + stat.size + 'B) — graphic may be blank');
                    }
                  } catch(e) {
                    console.log('Photo embed failed:', e.message);
                  }
                }
              }

              // Render PNG
              try {
                const page = await browser.newPage();
                await page.setViewport({ width: 1080, height: 1500, deviceScaleFactor: 1 });
                await page.setContent(html, { waitUntil: 'networkidle0', timeout: 30000 });
                await new Promise(r => setTimeout(r, 1500));
                const screenshot = await page.screenshot({
                  clip: { x: 0, y: 0, width: 1080, height: 1350 },
                  type: 'png'
                });
                fs.writeFileSync(pngPath, screenshot);
                console.log('Rendered:', pngName);
                await page.close();

                // Extract AIFEED_META and save as pending story
                const metaMatch = html.match(/<!--\s*AIFEED_META:([\s\S]*?)\s*-->/);
                if (metaMatch) {
                  try {
                    const meta = JSON.parse(metaMatch[1]);
                    const pending = {
                      htmlFile: file,
                      pngName,
                      headline: meta.headline || '',
                      liCaption: meta.liCaption || '',
                      sourceUrl: meta.sourceUrl || '',
                      date: meta.date || new Date().toISOString().substring(0,10),
                      savedAt: new Date().toISOString()
                    };
                    fs.mkdirSync('./_data', { recursive: true });
                    fs.writeFileSync('./_data/pending_story.json', JSON.stringify(pending, null, 2));
                    console.log('Saved pending story:', meta.headline.substring(0,60));
                  } catch(e) {
                    console.log('Could not save pending story:', e.message);
                  }
                }

                // Send HTML to Telegram with approval prompt
                const tmpHtml = '/tmp/tg_' + file;
                fs.writeFileSync(tmpHtml, html);
                try {
                  const headline = metaMatch ? (JSON.parse(metaMatch[1]).headline || '') : file;
                  const caption = '📸 <b>New graphic ready</b>\n' + headline.substring(0,120) + '\n\nReply <b>publish</b> to add to website.';
                  const result = execSync(
                    'curl -s ' +
                    '-F "chat_id=' + CHAT_ID + '" ' +
                    '-F "document=@' + tmpHtml + ';filename=' + file + ';type=text/html" ' +
                    '-F "caption=' + caption.replace(/"/g, '\\"') + '" ' +
                    '-F "parse_mode=HTML" ' +
                    '"https://api.telegram.org/bot' + BOT_TOKEN + '/sendDocument"',
                    { encoding: 'utf8', timeout: 30000 }
                  );
                  const parsed = JSON.parse(result);
                  if (parsed.ok) {
                    console.log('Sent to Telegram:', file);
                  } else {
                    console.log('Telegram send failed:', JSON.stringify(parsed));
                  }
                } catch(e) {
                  console.log('Telegram curl error:', e.message);
                }

              } catch(e) {
                console.error('Failed to render', file, ':', e.message);
              }
            }

            await browser.close();
            console.log('Done. Reply "publish" in Telegram to add story to website.');
          })().catch(e => { console.error(e); process.exit(1); });
          JSEOF

      - name: Commit rendered PNGs and pending story
        run: |
          git config user.name "AIFeed Bot"
          git config user.email "bot@aifeed.run"
          git add images/ _data/pending_story.json
          if git diff --staged --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "Render graphic — awaiting publish approval"
            git pull --rebase origin main
            git push
          fi
