name: Render HTML Graphics to PNG and Publish

on:
  push:
    paths:
      - 'graphics/*.html'

jobs:
  render:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache Puppeteer
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            ~/.cache/puppeteer
          key: ${{ runner.os }}-puppeteer-v2

      - name: Install Puppeteer
        run: npm install puppeteer

      - name: Render PNGs + Publish Stories + Send to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          node << 'JSEOF'
          const puppeteer = require('puppeteer');
          const fs   = require('fs');
          const path = require('path');
          const https = require('https');
          const { execSync } = require('child_process');

          const BOT_TOKEN = process.env.TELEGRAM_BOT_TOKEN;
          const CHAT_ID   = process.env.TELEGRAM_CHAT_ID;
          const SHEET_URL = 'https://docs.google.com/spreadsheets/d/1BCTHLe5ExoFwLMnQuayVWsVI8hBKfD7u54FiHGv_7rs/export?format=csv&gid=0';

          // ── helpers ──────────────────────────────────────────────────────────

          function fetchUrl(url) {
            return new Promise((resolve, reject) => {
              https.get(url, { headers: { 'User-Agent': 'Mozilla/5.0' } }, res => {
                if ([301, 302, 303, 307, 308].includes(res.statusCode))
                  return fetchUrl(res.headers.location).then(resolve).catch(reject);
                let d = ''; res.on('data', c => d += c); res.on('end', () => resolve(d));
                res.on('error', reject);
              }).on('error', reject);
            });
          }

          function splitRow(line) {
            const out = []; let inQ = false, cur = '';
            for (let i = 0; i < line.length; i++) {
              const c = line[i];
              if (c === '"') { if (inQ && line[i+1] === '"') { cur += '"'; i++; } else inQ = !inQ; }
              else if (c === ',' && !inQ) { out.push(cur); cur = ''; }
              else cur += c;
            }
            out.push(cur); return out;
          }

          function parseCSV(text) {
            const lines = text.split('\n');
            const valid = lines.filter(l => l.replace(/[,\s"]/g,'') !== '');
            if (!valid.length) return [];
            const headers = splitRow(valid[0]);
            return valid.slice(1).map(l => {
              const vals = splitRow(l);
              const obj = {};
              headers.forEach((h,i) => obj[h.trim()] = (vals[i]||'').trim());
              return obj;
            }).filter(r => r.Headline);
          }

          function liToHtml(caption) {
            if (!caption) return '<p>No content available.</p>';
            const paras = caption.split(/\n\n+/);
            const parts = [];
            paras.forEach((p, i) => {
              p = p.trim();
              if (!p || i === 0) return;
              if (/^Source:/i.test(p)) return;
              if (/^https?:\/\//.test(p)) return;
              if (/^#\w/.test(p)) {
                const tags = p.match(/#\w+/g) || [];
                parts.push('<p>' + tags.map(t =>
                  `<span style="color:#a050ff">${t}</span>`).join(' ') + '</p>');
                return;
              }
              parts.push('<p>' + p.replace(/\n/g,' ') + '</p>');
            });
            return parts.join('\n') || '<p>' + paras[0] + '</p>';
          }

          function makeSlug(headline) {
            return headline.toLowerCase()
              .replace(/[^a-z0-9\s]/g, '')
              .trim().split(/\s+/)
              .filter(w => w.length >= 2)
              .slice(0, 6).join('-');
          }

          function headlineKey(h) {
            return h.toLowerCase().replace(/[^a-z0-9]/g,'').substring(0,40);
          }

          function dateOnly(str) {
            if (!str) return new Date().toISOString().substring(0,10);
            const m = str.match(/(\d{4})-(\d{2})-(\d{2})/);
            if (m) return `${m[1]}-${m[2]}-${m[3]}`;
            const m2 = str.match(/(\d{1,2})\/(\d{1,2})\/(\d{4})/);
            if (m2) return `${m2[3]}-${m2[1].padStart(2,'0')}-${m2[2].padStart(2,'0')}`;
            return new Date().toISOString().substring(0,10);
          }

          function getCategory(headline) {
            const h = headline.toLowerCase();
            if (/research|study|paper|scientists|university/.test(h)) return 'Research';
            if (/launch|release|tool|app|update|version/.test(h)) return 'Tools';
            if (/model|gpt|claude|gemini|llm|mistral|llama/.test(h)) return 'Models';
            if (/fund|invest|billion|million|startup|raises/.test(h)) return 'Industry';
            return 'Industry';
          }

          // Extract keyword list from HTML filename for sheet matching
          // e.g. "aifeed_pentagon_strikes_classified_ai_1234567890.html"
          //   → ["pentagon", "strikes", "classified"]  (skip short/common words)
          function filenameKeywords(filename) {
            const SKIP = new Set(['ai', 'the', 'and', 'for', 'are', 'but', 'not', 'its', 'was', 'with', 'from', 'that', 'this', 'will', 'have', 'has', 'had', 'been', 'they']);
            return filename
              .replace(/^aifeed_/, '')          // strip prefix
              .replace(/_\d{10,}\.html$/, '')   // strip timestamp + extension
              .split('_')
              .filter(w => w.length >= 4 && !SKIP.has(w));
          }

          // ── main ─────────────────────────────────────────────────────────────

          (async () => {
            const browser = await puppeteer.launch({
              args: ['--no-sandbox', '--disable-setuid-sandbox', '--disable-dev-shm-usage']
            });

            const graphicsDir = './graphics';
            const imagesDir   = './images';
            const postsPath   = '_posts/posts-index.json';

            const newPngs = [];

            const files = fs.readdirSync(graphicsDir).filter(f => f.endsWith('.html'));

            // ── PHASE 1: Render PNGs ─────────────────────────────────────────
            for (const file of files) {
              const pngName = file.replace('.html', '.png');
              const pngPath = path.join(imagesDir, pngName);
              if (fs.existsSync(pngPath)) {
                console.log('Already exists:', pngName);
                continue;
              }

              console.log('Processing:', file);
              let html = fs.readFileSync(path.join(graphicsDir, file), 'utf8');

              // Embed background photo as base64 — handles Unsplash, Wikipedia, Wikimedia, any external URL
              // Must be embedded: Puppeteer in GitHub Actions cannot reach external URLs
              const alreadyEmbedded = html.includes('data:image/jpeg;base64,') || html.includes('data:image/png;base64,');
              if (alreadyEmbedded) {
                console.log('Photo already embedded as base64');
              } else {
                // Find any external http(s) URL in the .bg img src
                const urlMatch = html.match(/class="bg"[^>]*src="(https?:\/\/[^"]+)"/);
                if (!urlMatch) {
                  console.log('No external photo URL found in HTML — graphic will have no background');
                } else {
                  let photoUrl = urlMatch[1];

                  // Unsplash: must use download endpoint (images.unsplash.com returns HTML error)
                  const unsplashId = photoUrl.match(/images\.unsplash\.com\/photo-([a-zA-Z0-9_-]+)/);
                  if (unsplashId) {
                    photoUrl = 'https://unsplash.com/photos/' + unsplashId[1] + '/download?force=true';
                  }

                  console.log('Downloading photo:', photoUrl.substring(0, 80));
                  try {
                    execSync('curl -sL --user-agent "Mozilla/5.0" "' + photoUrl + '" -o /tmp/photo_embed.jpg', { timeout: 30000 });
                    const stat = fs.statSync('/tmp/photo_embed.jpg');
                    if (stat.size > 10000) {
                      const b64 = fs.readFileSync('/tmp/photo_embed.jpg').toString('base64');
                      // Replace the entire src="..." in the .bg img tag
                      html = html.replace(urlMatch[0], urlMatch[0].replace(urlMatch[1], 'data:image/jpeg;base64,' + b64));
                      console.log('Photo embedded (' + Math.round(stat.size/1024) + 'KB)');
                    } else {
                      console.log('Photo download too small (' + stat.size + 'B) — possible redirect/error, graphic may be blank');
                    }
                  } catch(e) {
                    console.log('Photo embed failed:', e.message);
                  }
                }
              }

              // Render PNG
              try {
                const page = await browser.newPage();
                await page.setViewport({ width: 1080, height: 1500, deviceScaleFactor: 1 });
                await page.setContent(html, { waitUntil: 'networkidle0', timeout: 30000 });
                await new Promise(r => setTimeout(r, 1500));
                const screenshot = await page.screenshot({
                  clip: { x: 0, y: 0, width: 1080, height: 1350 },
                  type: 'png'
                });
                fs.writeFileSync(pngPath, screenshot);
                console.log('Rendered:', pngName);
                await page.close();

                // Send HTML to Telegram
                const tmpHtml = '/tmp/tg_' + file;
                fs.writeFileSync(tmpHtml, html);
                try {
                  const result = execSync(
                    'curl -s ' +
                    '-F "chat_id=' + CHAT_ID + '" ' +
                    '-F "document=@' + tmpHtml + ';filename=' + file + ';type=text/html" ' +
                    '-F "caption=✅ Open in Chrome at 100% zoom → screenshot → post" ' +
                    '"https://api.telegram.org/bot' + BOT_TOKEN + '/sendDocument"',
                    { encoding: 'utf8', timeout: 30000 }
                  );
                  const parsed = JSON.parse(result);
                  if (parsed.ok) {
                    console.log('Sent to Telegram:', file);
                  } else {
                    console.log('Telegram send failed:', JSON.stringify(parsed));
                  }
                } catch(e) {
                  console.log('Telegram curl error:', e.message);
                }

                newPngs.push({ pngName, htmlFile: file });
              } catch(e) {
                console.error('Failed to render', file, ':', e.message);
              }
            }

            await browser.close();

            // ── PHASE 2: Publish new stories to posts-index.json ─────────────
            if (newPngs.length === 0) {
              console.log('No new PNGs — skipping publish step.');
              fs.writeFileSync('/tmp/new_pngs.txt', '');
              return;
            }

            console.log('\nFetching Google Sheet to match stories...');
            let sheetRows = [];
            try {
              const csv = await fetchUrl(SHEET_URL);
              sheetRows = parseCSV(csv);
              console.log('Sheet rows loaded:', sheetRows.length);
            } catch(e) {
              console.log('Sheet fetch failed:', e.message, '— skipping publish, PNGs still committed.');
            }

            const posts = JSON.parse(fs.readFileSync(postsPath, 'utf8'));
            const existingSlugs = new Set(posts.map(p => p.slug));
            const existingIds   = new Set(posts.map(p => p.id));
            const existingKeys  = new Set(posts.map(p => headlineKey(p.headline || '')));

            const newPosts = [];

            for (const { pngName, htmlFile } of newPngs) {
              const keywords = filenameKeywords(htmlFile);
              console.log('\nLooking for sheet match for:', htmlFile);
              console.log('Keywords:', keywords);

              if (!sheetRows.length || keywords.length < 2) {
                console.log('Skipping publish — no sheet data or too few keywords');
                continue;
              }

              // Find best matching sheet row by keyword overlap
              let bestRow = null, bestScore = 0;
              for (const row of sheetRows) {
                if (!row.Headline || !row.LinkedInCaption) continue;
                const hl = row.Headline.toLowerCase();
                const score = keywords.filter(k => hl.includes(k)).length;
                if (score > bestScore) { bestScore = score; bestRow = row; }
              }

              if (!bestRow || bestScore < 2) {
                console.log('No sheet match found (best score: ' + bestScore + ') — skipping publish');
                continue;
              }

              console.log('Matched (' + bestScore + '/' + keywords.length + '):', bestRow.Headline.substring(0,70));

              const headline = bestRow.Headline.trim();
              const slug  = makeSlug(headline);
              const date  = dateOnly(bestRow.Date || '');
              const id    = slug + '-' + date.replace(/-/g,'');
              const hKey  = headlineKey(headline);

              if (existingSlugs.has(slug) || existingIds.has(id) || existingKeys.has(hKey)) {
                console.log('Already published — skipping');
                continue;
              }

              const imageUrl    = 'https://aifeed.run/images/' + pngName;
              const liCaption   = (bestRow.LinkedInCaption || bestRow.Caption || '').trim();
              const body        = liToHtml(liCaption);
              const hashtags    = (liCaption.match(/#(\w+)/g) || []).map(t => t.slice(1));
              const paras       = liCaption.split(/\n\n+/).filter(p => p.trim());
              const summary     = (paras[1] || paras[0] || headline).replace(/\n/g,' ').substring(0,200).trim();

              const post = {
                id, slug, headline, summary, body,
                category:    getCategory(headline),
                imageUrl,
                sourceUrl:   (bestRow.SourceURL || '').trim(),
                publishedAt: bestRow.Date || new Date().toISOString(),
                hashtags,
                isVideo:     false
              };

              newPosts.push(post);
              existingSlugs.add(slug);
              existingIds.add(id);
              existingKeys.add(hKey);
              console.log('✅ Will publish:', headline.substring(0,70));
            }

            if (newPosts.length > 0) {
              const updated = [...newPosts, ...posts];
              fs.writeFileSync(postsPath, JSON.stringify(updated, null, 2));
              console.log('\nAdded ' + newPosts.length + ' post(s). Total: ' + updated.length);
            } else {
              console.log('\nNo new posts to add.');
            }

            fs.writeFileSync('/tmp/new_pngs.txt', newPngs.map(n => n.pngName).join('\n'));
            console.log('Done.');
          })().catch(e => { console.error(e); process.exit(1); });
          JSEOF

      - name: Commit rendered PNGs and published stories
        run: |
          git config user.name "AIFeed Bot"
          git config user.email "bot@aifeed.run"
          git add images/ _posts/posts-index.json
          if git diff --staged --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "Auto-render + publish: new story graphics"
            git pull --rebase origin main
            git push
          fi
