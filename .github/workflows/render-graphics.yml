name: Render HTML Graphics to PNG

on:
  push:
    paths:
      - 'graphics/*.html'

jobs:
  render:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache Puppeteer
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            ~/.cache/puppeteer
          key: ${{ runner.os }}-puppeteer-v3

      - name: Install Puppeteer
        run: npm install puppeteer

      - name: Render PNGs + Send to Telegram for Approval
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
        run: |
          node << 'JSEOF'
          const puppeteer = require('puppeteer');
          const fs   = require('fs');
          const path = require('path');
          const { execSync } = require('child_process');
          const https = require('https');

          const BOT_TOKEN          = process.env.TELEGRAM_BOT_TOKEN;
          const CHAT_ID            = process.env.TELEGRAM_CHAT_ID;
          const UNSPLASH_KEY       = 'dINF0W5ORDZVQlce-BlLgncgVTfTJLlEvAWKBlxaSGQ';

          // Base64 fingerprint of the two banned generic fallback photos from n8n.
          // Both have identical bytes at position 2000-2060 in their base64 encoding —
          // different from all real story photos. Used to detect when n8n embedded the fallback.
          const BANNED_B64_FINGERPRINT = 'BuMG9QcHBxkHKwc9B08HYQd0B4YHmQesB78H0gflB/gICwgfCDIIRghaCG4I';

          // ── Smart Unsplash search: topic-aware visual query builder ─────────
          function buildSearchQuery(headline) {
            const h = headline.toLowerCase();

            // ── Company / topic → visual scene mapping ────────────────────────
            // Each entry: [regex to detect topic, visual search query for Unsplash]
            const TOPIC_MAP = [
              // AI companies & products
              [/openai|chatgpt/,              'artificial intelligence technology futuristic'],
              [/anthropic|claude ai/,         'artificial intelligence research lab technology'],
              [/google deepmind|gemini/,      'google technology neural network server'],
              [/meta ai|llama/,               'social media technology AI interface'],
              [/xai|grok/,                    'dark code terminal programmer screen'],
              [/nvidia/,                      'computer chip GPU semiconductor technology'],
              [/microsoft copilot/,           'microsoft office productivity technology'],
              [/apple intelligence/,          'apple product design minimalist technology'],
              [/amazon aws|alexa/,            'amazon cloud server data center'],
              [/tesla|self.driving/,          'tesla electric car autonomous vehicle road'],
              [/spacex|starship/,             'rocket launch space technology'],
              [/waymo|autonomous/,            'self driving car street urban traffic'],
              // Finance & investment
              [/softbank/,                    'tokyo japan technology investment finance'],
              [/venture capital|vc fund/,     'business investment finance boardroom meeting'],
              [/ipo|stock market|nasdaq|nyse/, 'wall street stock market finance trading floor'],
              [/bank.*account|financial.*access|plaid/, 'bank building finance institution wall street'],
              [/billion.*fund|fund.*billion/, 'investment finance growth chart money'],
              [/crypto|bitcoin|ethereum/,     'cryptocurrency bitcoin digital blockchain'],
              // Energy & climate — specific before generic
              [/china.*grid|china.*energy|china.*renew|china.*solar|china.*wind/, 'china wind turbines energy farm infrastructure'],
              [/china.*ai|ai.*china/,         'china technology city skyline innovation'],
              [/renewable.*grid|smart.*grid|energy.*grid|grid.*map/, 'power grid energy infrastructure electricity technology'],
              [/wind turbine|offshore wind/,  'wind turbines offshore aerial renewable energy'],
              [/solar farm|solar panel/,      'solar farm panels aerial renewable energy'],
              [/solar|wind.*energy|renewable/, 'renewable energy solar wind farm aerial'],
              [/nuclear/,                     'nuclear power plant energy reactor'],
              [/fervo|geothermal/,            'geothermal energy power drill technology landscape'],
              [/electric vehicle|ev charging/, 'electric vehicle charging station clean energy'],
              [/climate|carbon emission/,     'climate environment green energy nature'],
              // Robotics & physical AI
              [/humanoid|physical ai|figure robot|1x robot/, 'humanoid robot factory automation industrial'],
              [/robot.*factor|factory.*robot/, 'factory robot automation industrial arm'],
              [/robot/,                       'robot automation machine technology'],
              [/drone/,                       'drone aerial technology flying sky'],
              [/manufacturing|factory floor/,  'factory manufacturing industrial production'],
              [/warehouse/,                   'warehouse logistics automation shelves workers'],
              // Health & biotech
              [/cancer|tumor|oncol/,          'medical research laboratory microscope science'],
              [/drug.*approv|fda.*approv/,     'pharmaceutical medicine drug research lab'],
              [/biotech|pharma/,              'biotechnology laboratory research science'],
              [/hospital|healthcare/,         'hospital healthcare medical professional'],
              // Social media & apps
              [/whatsapp/,                    'smartphone messaging app mobile chat'],
              [/instagram|tiktok/,            'social media phone content creator studio'],
              [/youtube/,                     'video streaming content creator camera studio'],
              // Cybersecurity
              [/hack|breach|cyber.*attack|security.*attack/, 'cybersecurity hacker dark code screen lock'],
              [/ransomware|malware/,           'cybersecurity threat dark computer screen'],
              [/privacy|data.*leak/,          'digital privacy data security padlock'],
              // Policy & regulation
              [/congress|senate|legislation|ai.*law|law.*ai/, 'us capitol congress government building'],
              [/antitrust|monopol/,           'government law court justice gavel'],
              [/tariff|trade.*war/,           'shipping port cargo containers global trade'],
              // General AI & tech topics
              [/ai.*agent|agent.*ai/,         'artificial intelligence autonomous robot technology'],
              [/large language|llm/,          'neural network deep learning abstract technology'],
              [/semiconductor|chip.*foundry|foundry.*chip/, 'semiconductor chip microprocessor circuit board'],
              [/data center/,                 'data center server room technology cooling'],
              [/coding|developer|software engineer/, 'programmer coding laptop dark terminal'],
              [/blackstone|carlyle|kkr|private equity/, 'wall street finance investment building night'],
              [/ai.*infrastructure|infrastructure.*ai/, 'data center server room blue technology'],
              [/billion.*invest|invest.*billion/, 'investment finance technology data center'],
              [/tpu|tensor processing unit/,   'google technology chip semiconductor circuit'],
              [/microsoft(?!.*copilot)|azure/,  'microsoft technology office building modern'],
              [/startup.*rais|rais.*million/,  'startup tech office modern workspace team'],
              [/layoff|job.*cut/,             'office business people technology workplace'],
              [/search engine/,               'internet search computer browser technology'],
              [/map|mapping/,                 'aerial map satellite technology infrastructure'],
              [/schmidt|google ceo|eric schmidt/, 'google headquarters technology modern office'],
              [/eric.*ceo|ceo.*tech/,         'technology executive business modern office'],
            ];

            for (const [pattern, query] of TOPIC_MAP) {
              if (pattern.test(h)) {
                console.log('Topic map matched:', String(pattern), '→', query);
                return query;
              }
            }

            // ── Fallback: strip stop words, keep meaningful terms ─────────────
            const stopWords = new Set(['the','a','an','is','are','was','were','has','have','had','will','its','with','that','this','for','and','but','not','from','into','been','being','after','about','their','they','who','what','how','why','when','posts','gets','says','could','would','should','which','also','than','more','just','last','year','fiscal','first','new','over','under','amid','sees','puts','makes','marks','mainly','huge','major','biggest','driven','record','gain','loss','deal','move','plan','bet','up','on','at','in','of','to','by','as','or','if','now','wants','access','your']);
            const words = headline.replace(/[^a-zA-Z0-9\s]/g, ' ').split(/\s+/).filter(w => w.length > 2 && !stopWords.has(w.toLowerCase()));
            return words.slice(0, 4).join(' ') + ' technology';
          }

          // ── Search Unsplash for a story-appropriate photo ─────────────────────
          async function searchUnsplash(query) {
            if (!UNSPLASH_KEY) { console.log('No Unsplash key'); return null; }
            return new Promise((resolve) => {
              // Use per_page=10 and pick randomly from top 8 for more variety
              const url = 'https://api.unsplash.com/search/photos?query=' +
                encodeURIComponent(query) + '&orientation=portrait&per_page=10';
              https.get(url, { headers: { 'Authorization': 'Client-ID ' + UNSPLASH_KEY } }, (res) => {
                let data = '';
                res.on('data', d => data += d);
                res.on('end', () => {
                  try {
                    const r = JSON.parse(data);
                    const photos = r.results || [];
                    if (!photos.length) { resolve(null); return; }
                    // Always use the #1 most relevant result — random picks cause wrong photos
                    resolve(photos[0].urls.regular);
                  } catch(e) { resolve(null); }
                });
              }).on('error', () => resolve(null));
            });
          }

          // ── main ─────────────────────────────────────────────────────────────
          (async () => {
            const browser = await puppeteer.launch({
              args: ['--no-sandbox', '--disable-setuid-sandbox', '--disable-dev-shm-usage']
            });

            const graphicsDir = './graphics';
            const imagesDir   = './images';
            // Only render HTML files changed in THIS push — never re-render existing ones
            let files;
            try {
              const changed = execSync('git diff HEAD~1 --name-only -- graphics/ 2>/dev/null || true')
                .toString().trim().split('\n')
                .filter(f => f.endsWith('.html'))
                .map(f => path.basename(f));
              files = changed.length > 0 ? changed : fs.readdirSync(graphicsDir).filter(f => f.endsWith('.html'));
              console.log('Files to render:', files);
            } catch(e) {
              files = fs.readdirSync(graphicsDir).filter(f => f.endsWith('.html'));
            }

            for (const file of files) {
              const pngName = file.replace('.html', '.png');
              const pngPath = path.join(imagesDir, pngName);
              if (fs.existsSync(pngPath)) {
                console.log('Already exists:', pngName);
                continue;
              }

              console.log('Processing:', file);
              let html = fs.readFileSync(path.join(graphicsDir, file), 'utf8');

              // Extract headline from AIFEED_META for smart photo search
              const metaMatch = html.match(/<!--\s*AIFEED_META:([\s\S]*?)\s*-->/);
              let headline = file.replace('.html','').replace(/_/g,' ');
              if (metaMatch) {
                try { headline = JSON.parse(metaMatch[1]).headline || headline; } catch(e) {}
              }

              // ── Photo embedding ──────────────────────────────────────────────
              const alreadyEmbedded = html.includes('data:image/jpeg;base64,') || html.includes('data:image/png;base64,');

              // Detect if n8n embedded the banned fallback photo as base64.
              // Both banned photos share an identical fingerprint at chars 2000-2060 of their base64.
              let isBannedB64 = false;
              if (alreadyEmbedded) {
                const b64Match = html.match(/data:image\/jpeg;base64,([A-Za-z0-9+/=]{2100,})/);
                if (b64Match && b64Match[1].substring(2000, 2060) === BANNED_B64_FINGERPRINT) {
                  isBannedB64 = true;
                  console.log('Banned fallback photo detected embedded as base64 — replacing with story photo');
                }
              }

              if (alreadyEmbedded && !isBannedB64) {
                console.log('Photo already embedded as base64 — using as-is');
              } else {
                // Either not base64 OR it's the banned fallback.
                // ALWAYS search Unsplash using smart keywords extracted from the headline.
                const smartQuery = buildSearchQuery(headline);
                console.log('Searching Unsplash for:', smartQuery, '(from headline:', headline.substring(0,50) + ')');

                // Ensure img.bg tag exists
                if (!html.includes('class="bg"')) {
                  html = html.replace('<div class="c"><div class="ov">', '<div class="c"><img class="bg" src="" alt=""><div class="ov">');
                }

                let photoUrl = await searchUnsplash(smartQuery);

                // If smart query fails, retry with first 3 words of headline
                if (!photoUrl) {
                  const fallbackQuery = headline.split(' ').slice(0, 3).join(' ');
                  console.log('Retrying Unsplash with:', fallbackQuery);
                  photoUrl = await searchUnsplash(fallbackQuery);
                }

                if (photoUrl) {
                  console.log('Unsplash found:', photoUrl.substring(0,80));
                  // Only convert bare unsplash.com page URLs — CDN URLs download directly
                  const bareUnsplash = photoUrl.match(/^https:\/\/unsplash\.com\/photos\/([a-zA-Z0-9_-]+)$/);
                  if (bareUnsplash) {
                    photoUrl = 'https://unsplash.com/photos/' + bareUnsplash[1] + '/download?force=true';
                  }
                  console.log('Downloading:', photoUrl.substring(0, 100));
                  try {
                    execSync('curl -sL --user-agent "Mozilla/5.0 (compatible; AIFeed/1.0; +https://aifeed.run)" "' + photoUrl + '" -o /tmp/photo_embed.jpg', { timeout: 30000 });
                    const stat = fs.statSync('/tmp/photo_embed.jpg');
                    if (stat.size > 10000) {
                      const newB64 = fs.readFileSync('/tmp/photo_embed.jpg').toString('base64');
                      if (isBannedB64) {
                        // Replace the entire banned base64 block
                        html = html.replace(/data:image\/jpeg;base64,[A-Za-z0-9+/=]+/, 'data:image/jpeg;base64,' + newB64);
                      } else {
                        // Replace URL src or empty src with base64
                        const anyMatch = html.match(/class="bg"[^>]*src="([^"]+)"/);
                        if (anyMatch) {
                          // Non-empty src (URL) — replace the URL value with base64
                          html = html.replace(anyMatch[1], 'data:image/jpeg;base64,' + newB64);
                        } else {
                          // Empty src="" — inject base64 directly
                          html = html.replace(/src=""([^>]*)>/, 'src="data:image/jpeg;base64,' + newB64 + '"$1>');
                        }
                      }
                      console.log('Photo embedded (' + Math.round(stat.size/1024) + 'KB)');
                    } else {
                      console.log('Photo download too small (' + stat.size + 'B) — rendering with dark background');
                    }
                  } catch(e) {
                    console.log('Photo embed failed:', e.message);
                  }
                } else {
                  console.log('Unsplash returned nothing — rendering with dark background');
                }
              }

              // ── Render PNG ───────────────────────────────────────────────────
              try {
                const page = await browser.newPage();
                await page.setViewport({ width: 1080, height: 1500, deviceScaleFactor: 1 });
                await page.setContent(html, { waitUntil: 'networkidle0', timeout: 30000 });
                await new Promise(r => setTimeout(r, 1500));
                const screenshot = await page.screenshot({
                  clip: { x: 0, y: 0, width: 1080, height: 1350 },
                  type: 'png'
                });
                fs.writeFileSync(pngPath, screenshot);
                console.log('Rendered:', pngName);
                await page.close();

                // Save pending story from AIFEED_META
                if (metaMatch) {
                  try {
                    const meta = JSON.parse(metaMatch[1]);
                    const pending = {
                      htmlFile: file, pngName,
                      headline: meta.headline || '',
                      liCaption: meta.liCaption || '',
                      sourceUrl: meta.sourceUrl || '',
                      date: meta.date || new Date().toLocaleDateString('en-CA', { timeZone: 'America/New_York' }),
                      savedAt: new Date().toISOString()
                    };
                    fs.mkdirSync('./_data', { recursive: true });
                    fs.writeFileSync('./_data/pending_story.json', JSON.stringify(pending, null, 2));
                    console.log('Saved pending story:', meta.headline.substring(0,60));
                  } catch(e) { console.log('Could not save pending story:', e.message); }
                }

                // Send HTML to Telegram
                const tmpHtml = '/tmp/tg_' + file;
                fs.writeFileSync(tmpHtml, html);
                try {
                  const hl = metaMatch ? (JSON.parse(metaMatch[1]).headline || '') : file;
                  const caption = '📸 <b>New graphic ready</b>\n' + hl.substring(0,120) + '\n\nReply <b>publish</b> to add to website.';
                  const result = execSync(
                    'curl -s ' +
                    '-F "chat_id=' + CHAT_ID + '" ' +
                    '-F "document=@' + tmpHtml + ';filename=' + file + ';type=text/html" ' +
                    '-F "caption=' + caption.replace(/"/g, '\\"') + '" ' +
                    '-F "parse_mode=HTML" ' +
                    '"https://api.telegram.org/bot' + BOT_TOKEN + '/sendDocument"',
                    { encoding: 'utf8', timeout: 30000 }
                  );
                  const parsed = JSON.parse(result);
                  console.log(parsed.ok ? 'Sent to Telegram: ' + file : 'Telegram failed: ' + JSON.stringify(parsed));
                } catch(e) { console.log('Telegram curl error:', e.message); }

              } catch(e) {
                console.error('Failed to render', file, ':', e.message);
              }
            }

            await browser.close();
            console.log('Done.');
          })().catch(e => { console.error(e); process.exit(1); });
          JSEOF

      - name: Commit rendered PNGs and pending story
        run: |
          git config user.name "AIFeed Bot"
          git config user.email "bot@aifeed.run"
          git add images/ _data/pending_story.json
          if git diff --staged --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "Render graphic — awaiting publish approval"
            git pull --rebase origin main
            git push
          fi
