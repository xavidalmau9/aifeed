name: Publish GitHub Pages

# Pages publishes this directory when the source is GitHub Actions. The repository
# setting is still "deploy from main", which publishes the branch tip, so media
# older than 3 days is also removed from the tip (it stays in git history and the
# archived-media release). Recent Reels and page images stay at their public URLs
# for the 8am autopilot (Instagram, Facebook, Buffer).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full commit history so video age is the real commit time. blob:none
          # skips historical file contents; HEAD blobs are still checked out.
          fetch-depth: 0
          filter: blob:none
      - name: Test publish staging
        run: python3 scripts/test_stage_pages.py
      - name: Archive media older than 3 days and drop it from this branch
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "aifeed-pages"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          before=$(git rev-parse HEAD)
          python3 scripts/prune_pages_media.py --commit
          if [ "$(git rev-parse HEAD)" != "$before" ]; then
            git push origin HEAD:main
          fi
      - name: Stage publish directory
        run: python3 scripts/stage_pages.py "$RUNNER_TEMP/aifeed-pages"
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/aifeed-pages

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 900000
