name: Publish GitHub Pages

# Stages a publish directory and deploys that, instead of the whole branch.
# The branch still holds every video and image. Pages only receives article pages,
# the images those pages reference, and Reel/story media from the last 3 days
# (the window Instagram, Facebook, and Buffer need to fetch the public URL).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Branch deploys upload the whole repo (~1.3GB) and time out. This switches the
  # site to GitHub Actions so only the staged directory below is published.
  # AIFEED_GH_TOKEN is the same PAT the 8am autopilot uses to push; it can change
  # the Pages source when the workflow token cannot.
  configure:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Set Pages to deploy from this workflow
        env:
          PAT: ${{ secrets.AIFEED_GH_TOKEN }}
          WORKFLOW_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - << 'PY'
          import json, os, urllib.error, urllib.request
          repo = os.environ["GITHUB_REPOSITORY"]
          url = f"https://api.github.com/repos/{repo}/pages"
          body = json.dumps({"build_type": "workflow"}).encode()
          last = "no token"
          for name, key in (("AIFEED_GH_TOKEN", "PAT"), ("GITHUB_TOKEN", "WORKFLOW_TOKEN")):
              token = os.environ.get(key) or ""
              if not token:
                  print(name, "unset")
                  continue
              req = urllib.request.Request(url, data=body, method="PUT", headers={
                  "Authorization": "Bearer " + token,
                  "Accept": "application/vnd.github+json",
                  "Content-Type": "application/json",
                  "User-Agent": "aifeed-pages",
              })
              try:
                  with urllib.request.urlopen(req, timeout=30) as res:
                      data = json.loads(res.read().decode() or "{}")
                      print(name, res.status, "build_type", data.get("build_type"))
                      if data.get("build_type") == "workflow":
                          raise SystemExit(0)
              except urllib.error.HTTPError as e:
                  try:
                      msg = json.loads(e.read().decode()).get("message")
                  except Exception:
                      msg = "http error"
                  print(name, e.code, msg)
                  last = f"{name} HTTP {e.code}"
          raise SystemExit("could not set Pages build_type=workflow (" + last + ")")
          PY

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full commit history so video age is the real commit time. blob:none
          # skips historical file contents; HEAD blobs are still checked out.
          fetch-depth: 0
          filter: blob:none
      - name: Test publish staging
        run: python3 scripts/test_stage_pages.py
      - name: Stage publish directory
        run: python3 scripts/stage_pages.py "$RUNNER_TEMP/aifeed-pages"
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/aifeed-pages

  deploy:
    if: github.event_name != 'pull_request'
    needs: [build, configure]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 900000
